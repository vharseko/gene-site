<title>Снимок Лагутиной (Кусраевой) Лидии Ильиничны за партой</title><meta name="description" content="Чёрно-белый снимок. Молодая женщина с тёмными волосами, в тёмном жакете с отделкой и светлой блузке, сидит за партой с номером «12», пишет и держится рукой за голову; на соседней парте — сумка; у стены стул. Надписей на лицевой стороне нет; год съёмки не известен. Кто изображён — по словам составителя: «Лагутина Лидия», то есть Кусраева (урождённая Лагутина) Лидия Ильинична.">
