<title>Паспорт Петриченко Семена Ивановича, 1954</title><meta name="description" content="Левая страница: «ПАСПОРТ. Действителен по 7 июня 1964. 1. Имя, отчество, фамилия: Петриченко Семен Иванович. 2. Время и место рождения: 19.II.1928, д. Ваганичи Добрянск[ого] р-на Черниговск[ой] обл. 3. Национальность: украинец». Фотография владельца, бланк XVIII-НУ № 740382, внизу подпись владельца «Петр[иченко]» [?] (4. Подпись владельца паспорта); круглая печать отделения милиции г. Гомеля [читается частично]. Правая страница: «5. Социальное положение: служащий. 6. Отношение к военной службе: снят с в/учёта по гр. I ст. 21. 7. Кем выдан паспорт: 4 отд. милиции г. Гомель. 8. На основании каких документов выдан паспорт: XII-НУ 726129, [выдан] Гомельским РОМ Гом. обл. 2.VI.48; св[идетельство] о р[ождении], д. Ваганичи Добрянск[ого] р-на, 19.II.28». Подписи начальника милиции [неразборчиво] и начальника паспортного стола «Н. Позняк» [?]; дата выдачи 7 июня 1954; печать «… МВД … милиции … Гомельской обл.» [читается частично]. Внизу — номер бланка XVIII-НУ № [7]40382. Доказывает: Петриченко Семен Иванович родился 19 февраля 1928 года в д. Ваганичи Добрянского района Черниговской области, украинец; в 1948 и 1954 годах получал паспорт в Гомеле; в 1954 году — служащий, снят с воинского учёта. Что это отец Татьяны Семёновны, сам паспорт не говорит: совпадают имя, фамилия и село, где она родилась в 1956 году (S4); документ прислан составителем вслед за рассказом о дедушке (S30).">
