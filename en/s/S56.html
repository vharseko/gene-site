<title>Рассказ составителя о фамилиях бабушки Натальи Матвеевны, 2026</title><meta name="description" content="Дословно: «Наталья Матвеевна девичья Савочкина, потом вероятно Петриченко, потом Гулакова». Сообщает: девичья фамилия Гулаковой Натальи Матвеевны — Савочкина; потом она, вероятно, носила фамилию Петриченко, затем — Гулакова. Фамилия Петриченко названа с оговоркой «вероятно»; даты браков не названы.">
