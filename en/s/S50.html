<title>Общий памятник Гулаковых Василия Антоновича и Натальи Матвеевны (кадр из видео), 2025</title><meta name="description" content="Двойной тёмный гранитный памятник: два портрета — мужчины (слева) и женщины (справа), между ними крест и розы. Надпись: «ГУЛАКОВЫ»; слева — «ВАС[ИЛИЙ] / АНТ[ОНОВИЧ]» [остальное закрыто]; справа — «НАТАЛЬЯ / МАТВЕЕВНА / 11.04.1930 / 06.02.2012». Внизу строка эпитафии: «[…] И в памяти нашей всегда вы с нами» [?]. К левой половине прислонена небольшая фотография мужчины в фуражке с подписью [неразборчиво]: она закрывает остаток имени и даты Василия Антоновича. Два цветника с бордюрами, металлическая ограда. Доказывает: Гулакова Наталья Матвеевна родилась 11 апреля 1930 года и умерла 6 февраля 2012 года (по памятнику); отчество на памятнике — Матвеевна. Она похоронена на том же кладбище, что и её дети Татьяна (S47), Петр (S48) и Виктор (S49). Василий Антонович назван на том же памятнике; его даты по этому кадру не видны.">
