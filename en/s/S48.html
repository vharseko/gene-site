<title>Памятник Гулакова Петра Васильевича (кадр из видео), 2025</title><meta name="description" content="Тёмный гранитный памятник, слева — крест, портрет. Надпись: «ГУЛАКОВ / ПЁТР / ВАСИЛЬЕВИЧ / 25.06.1958 – 26.03.2018». Ниже эпитафия в четыре строки [неразборчиво], внизу — гравировка: розы и свечи. Цветник с гранитной плитой, металлическая ограда, ваза. Тот же памятник виден за спиной человека на снимке. Доказывает: Гулаков Пётр Васильевич родился 25 июня 1958 года и умер 26 марта 2018 года (по памятнику); похоронен на том же кладбище, что и Татьяна Семёновна Кисель (S47).">
