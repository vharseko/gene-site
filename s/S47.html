<title>Памятник Кисель Татьяны Семёновны (кадр из видео), 2025</title><meta name="description" content="Гранитный памятник с аркой, наверху крест, портрет. Надпись: «Кисель / Татьяна / Семёновна / 12.06.1956 – 09.07.2022». Ниже эпитафия в четыре строки: «На всю оставшуюся жизнь / Нам хватит горя и печали, / О той, кого любили мы, / [неразборчиво]» [?]. Цоколь и цветник из серого гранита, кованая ограда; в цветнике — искусственные цветы и лампада. Рядом — голубая ограда соседней могилы. Доказывает: могила Татьяны Семёновны Кисель с памятником стоит на том же кладбище, что и могилы Гулаковых (S48–S50); даты на памятнике совпадают со свидетельством о смерти (S2) и паспортом (S4).">
