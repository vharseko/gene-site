<title>Памятник Кусраевой Лидии Ильиничны</title><meta name="description" content="Памятник из чёрного полированного камня в раме из серого гранита. Вверху слева — православный крест, гравированный портрет женщины. Надпись: «КУСРАЕВА / [ЛИД?]ИЯ / [ИЛ?]ЬИНИЧНА / 19[?]4 – 2023 / 05.03. 15.08». Часть имени и отчества, а также третью цифру года рождения закрывают прислонённые к плите цветы и блик. Год рождения — 1934, по ответу составителя (S54). Цветник из серого гранита, засыпан песком; в нём искусственные цветы, справа — белая ваза с красными розами, на ограде слева — чёрная траурная лента. Кругом — ряды металлических оград с крестами и памятниками. Доказывает: могила Кусраевой Лидии Ильиничны с памятником; по памятнику она родилась 5 марта 19[?]4 года и умерла 15 августа 2023 года. Число и месяц рождения совпадают с пересказом материалов дела, год смерти — с рассказом зятя (S13).">
