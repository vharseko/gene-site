<title>Некролог «Ушел из жизни наш товарищ, ХАРСЕКО Валерий Николаевич», 2021</title><meta name="description" content="Из текста некролога: «21 мая 2021 года ушел из жизни наш товарищ, выпускник Минского СВУ 15 выпуска (6 рота) полковник в отставке Валерий Николаевич Харсеко. Родился Валерий 9 мая 1954 года в г. Мозыре Гомельской области. В 1971 г. окончил Минское СВУ, в 1975 — Харьковское гвардейское высшее танковое командное училище, в 1992 — Военную академию бронетанковых войск.» Далее: на офицерской службе прошёл должности «от командира взвода до командира батальона»; «В 1986 году принимал участие в боевых действиях на территории ДРА в должности заместителя командира горного рейдового батальона. В одном из боев с моджахедами был ранен.» После Афганистана — «старшего офицера оперативного отделения штаба армейского корпуса, а затем — преподавателя огневой подготовки Военной академии Республики Беларусь». «Награжден орденами Красной Звезды, „За службу Родине в Вооруженных Силах СССР“ III степени, медалями СССР и ДРА.» После увольнения в запас — менеджер концерна «Беллегпром», коммерческий директор компании «Военная техника», директор предприятия «Пассажирские перевозки». Конец некролога: «…выражают его родным и близким искренние соболезнования. Похоронен на родине.» На странице — фотография без подписи. Родственники в некрологе не названы. Что это отец составителя (I2), известно со слов сына; совпадают фамилия, имя и отчество. Сообщает (публикация, не документ ЗАГС): Харсеко Валерий Николаевич родился 9 мая 1954 года в г. Мозыре Гомельской области, умер 21 мая 2021 года; полковник в отставке. Место смерти и место погребения не указаны.">
