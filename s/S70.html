<title>Рассказ составителя о Савочкиной Славе Матвеевне, её муже и дочери, 2026</title><meta name="description" content="Дословно (об умерших): «Савочкина Слава Матвеевна умерла, похоронена в Маковье, муж Кобзарь Вячеслав родом из украины донбасс, похоронен в Тереховке, дети Кобзарь Инна (умерла похоронена в Маковье), Кобзарь Михайил …». Сообщает: Савочкина Слава Матвеевна умерла и похоронена в Маковье. Её муж — Кобзарь Вячеслав, родом из Украины, из Донбасса; похоронен в Тереховке. Их дети — Кобзарь Инна (умерла, похоронена в Маковье) и Кобзарь Михаил. Даты жизни, отчества Вячеслава и Инны, кладбища не названы. Остальная часть рассказа — о живых родственниках, на сайт не выносится.">
