<title>Рассказ составителя об отчестве бабушки Гулаковой Натальи, 2026</title><meta name="description" content="Дословно: «Гулакова Наталья Тимофеевна Матвеевна». На вопрос, как это понять — в свидетельстве о рождении сына Василия написано «Тимофеевна», а над строкой вписано «Матвеевна», — ответ: «Верно „Матвеевна“». Сообщает: отчество Гулаковой Натальи — Матвеевна; «Тимофеевна» в свидетельстве о рождении сына, по словам составителя, неверно.">
