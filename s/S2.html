<title>Свидетельство о смерти Кисель Татьяны Семёновны, 2022 (повторное)</title><meta name="description" content="Повторное свидетельство о смерти на двух языках: левая половина по-белорусски, правая по-русски, содержание одинаковое. Русская половина: «Повторное. СВИДЕТЕЛЬСТВО О СМЕРТИ. Гражданин(ка) Кисель Татьяна Семёновна, идентификационный № […], умер(ла) 09.07.2022, девятого июля две тысячи двадцать второго года, в возрасте 66 лет, о чем в книге регистрации актов о смерти 11 числа июля месяца 2022 года произведена запись за № 11742. Причина смерти M34.0. Место смерти: республика (государство) Беларусь; область (край) — [не заполнено]; район — [не заполнено]; город (поселок, село, деревня) г. Минск. Место регистрации смерти: Отдел ЗАГС главного управления юстиции Мингорисполкома. Дата выдачи «15» декабря [20]22. Руководитель органа загса — подпись, С.П. Храпович». Печать: «[Главное] управление юстиции Мингорисполкома. Отдел записи актов гражданского состояния. Республика Беларусь» [читается частично]. Бланк I-ВН № 1254723. На белорусской половине: «Кісель Таццяна Сямёнаўна», «Аддзел ЗАГС галоўнага ўпраўлення юстыцыі Мінгарвыканкама», «С.П. Храповіч». Идентификационный номер не переписан и закрыт на копии. Доказывает: Кисель Татьяна Семёновна умерла 9 июля 2022 года в г. Минске в возрасте 66 лет.">
