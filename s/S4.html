<title>Паспорт гражданина Республики Беларусь Кисель Татьяны Семёновны, 2016</title><meta name="description" content="Страница 31, по-белорусски и по-русски: «Прозвішча/Фамилия КІСЕЛЬ / КИСЕЛЬ. Імя/Имя ТАЦЦЯНА / ТАТЬЯНА. Імя па бацьку/Отчество СЯМЁНАЎНА / СЕМЁНОВНА. Дата нараджэння/Дата рождения 12 06 1956. Ідэнтыфікацыйны №/Идентификационный № […]. Месца нараджэння/Место рождения УКРАІНА, ЧАРНІГАЎСКАЯ ВОБЛАСЦЬ, ДАБРАНСКІ Р-Н, С ВАГАНІЧЫ / УКРАИНА, ЧЕРНИГОВСКАЯ ОБЛАСТЬ, ДОБРЯНСКИЙ Р-Н, С ВАГАНИЧИ. Дата выдачы/Дата выдачи 10 06 2016. Тэрмін дзеяння/Срок действия 10 06 2026. Орган, які выдаў пашпарт/Орган, выдавший паспорт САВЕЦКАЕ РУУС Г.МІНСКА / СОВЕТСКОЕ РУВД Г.МИНСКА». Страница с фотографией: «ПАШПАРТ / PASSPORT. Тып P, код дзяржавы BLR, нумар пашпарта […]. KISEL TATSIANA. Грамадзянства/Nationality REPUBLIC OF BELARUS. Дата нараджэння 12 06 1956. Ідэнтыфікацыйны нумар […]. Пол F. Месца нараджэння/Place of birth UKR. Дата выдачы 10 06 2016, тэрмін дзеяння 10 06 2026, орган MINISTRY OF INTERNAL AFFAIRS»; фотография владелицы; машиночитаемая строка «P&lt;BLRKISEL&lt;&lt;TATSIANA&lt;&lt;&lt;…», вторая строка закрыта на копии. Страница 32: подпись владельца, подпись должностного лица, печать «Міністэрства ўнутраных спраў Рэспублікі Беларусь … па грамадзянству і міграцыі» [читается частично], «М. П. 3». Страница 30 «Іншыя адзнакі / Другие отметки» пустая. Номер паспорта, идентификационный номер и вторая машиночитаемая строка не переписаны и закрыты на копии. Доказывает: Кисель Татьяна Семёновна родилась 12 июня 1956 года в селе Ваганичи Добрянского района Черниговской области (Украина); в 2016 году — гражданка Республики Беларусь.">
